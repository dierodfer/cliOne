name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Permissions are declared per job so each one gets only what it needs
    # instead of inheriting a workflow-wide grant.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # Pinned to the v7.0.1 commit: a mutable tag can be repointed at
        # arbitrary code by anyone who can push to the action's repo.
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.5.0

      - name: go test
        run: go test -race ./...

  comment:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Upsert PR summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- clione-ci-summary -->';
            const result = '${{ needs.test.result }}';
            const emoji = result === 'success' ? '✅' : '❌';
            const body = `${marker}\n${emoji} PR checks: **${result}** (Go tests, Linux)\n\n[View run](${context.payload.pull_request.html_url}/checks)`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
